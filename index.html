<script>
/* Mulai ambil data SEKARANG (paralel dengan pemuatan app.js) — hemat ~100-300 ms */
(function(){var c=window.APP_CONFIG||{},u=c.GAS_URL;if(!u||/GANTI|XXXX/.test(u))return;
try{var s=JSON.parse(localStorage.getItem('da_boot')||'null');
window.__boot=fetch(u+'?action=boot'+(s&&s.pv?'&pv='+encodeURIComponent(s.pv):'')).then(function(r){return r.json()}).catch(function(){return null});}catch(e){}})();
</script>
